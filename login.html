<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <title>Login • BioRise</title>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-visual">
      <div>
        <div class="brand-mark">B</div>
        <p class="eyebrow">BIORISE OPERATIONS</p>
        <h1>One clear view of every working day.</h1>
        <p>Designed for fast mobile use in the field and a richer management view for administrators.</p>
      </div>
      <div class="mini-stats">
        <span>Tasks</span><span>Planning</span><span>Progress</span><span>People</span>
      </div>
    </section>
    <section class="login-panel glass">
      <div class="mobile-brand"><span class="brand-mark small">B</span><strong>BioRise</strong></div>
      <p class="eyebrow">SECURE ACCESS</p>
      <h2>Welcome back</h2>
      <p class="muted">Use your BioRise identification and passcode.</p>
      <form id="loginForm" class="form-stack">
        <label>Identification
          <input id="workerId" autocomplete="username" placeholder="WRK001 or admin email" required>
        </label>
        <label>Passcode
          <input id="passcode" type="password" autocomplete="current-password" placeholder="Enter passcode" required>
        </label>
        <p id="loginError" class="form-error" aria-live="polite"></p>
        <button class="btn primary wide" type="submit">Sign in</button>
      </form>
      <button class="icon-btn theme-login" data-theme-toggle aria-label="Toggle theme">◐</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js"></script>
  <script type="module" src="js/auth/login.js"></script>
</body>
</html>
